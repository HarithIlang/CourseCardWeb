<!-- The course form boxes. Used by the "Add Course" box and by the course card being edited. -->
{{ form.non_field_errors }}
<div class="form-grid">
    {% for field in form %}
        <div class="form-row">
            {% if field.name == 'meetingDays' %}
                <!-- Meeting days: a drop-down with a checkbox for each day -->
                <span class="form-label">{{ field.label }}</span>
                <details class="days-dropdown">
                    <summary class="days-summary">Pick days</summary>
                    <div class="days-options">{{ field }}</div>
                </details>
            {% else %}
                <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                {{ field }}
            {% endif %}
            {% for error in field.errors %}
                <p class="form-error">{{ error }}</p>
            {% endfor %}
        </div>
    {% endfor %}
</div>
